
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چارچیز | سفارش آنلاین</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Tahoma,Arial,sans-serif}
header{background:#171717;color:white;padding:25px 18px;text-align:center}
header h1{font-size:30px;margin:5px;color:#ff3535}
header p{color:#ddd;margin:8px}
.container{max-width:750px;margin:auto;padding:18px}
h2{font-size:21px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.item{background:white;border-radius:13px;padding:15px;box-shadow:0 2px 8px #ddd}
.item .emoji{font-size:48px;text-align:center;padding:12px}
.item h3{margin:8px 0}
.price{color:#d62828;font-weight:bold;margin:10px 0}
button{border:0;background:#d62828;color:white;padding:11px 15px;border-radius:8px;font-size:14px;cursor:pointer}
.cart{background:white;padding:17px;border-radius:13px;margin-top:25px}
.cart p{border-bottom:1px solid #eee;padding:8px}
.total{font-weight:bold;font-size:18px}
footer{text-align:center;padding:25px;color:#777}
@media(max-width:380px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h1>🍕 چارچیز</h1>
<p>طعم خوشمزه، سفارش آسان!</p>
</header>

<main class="container">
<h2>🍽️ منوی غذا</h2>

<div class="menu">
<div class="item">
<div class="emoji">🍕</div>
<h3>پیتزا مخلوط</h3>
<div class="price">قیمت: به‌زودی</div>
<button onclick="add('پیتزا مخلوط')">افزودن به سبد</button>
</div>

<div class="item">
<div class="emoji">🍗</div>
<h3>مغز فیله سوخاری</h3>
<div class="price">قیمت: به‌زودی</div>
<button onclick="add('مغز فیله سوخاری')">افزودن به سبد</button>
</div>

<div class="item">
<div class="emoji">🍔</div>
<h3>ساندویچ مرغ</h3>
<div class="price">قیمت: به‌زودی</div>
<button onclick="add('ساندویچ مرغ')">افزودن به سبد</button>
</div>

<div class="item">
<div class="emoji">🍟</div>
<h3>سیب زمینی سرخ کرده</h3>
<div class="price">قیمت: به‌زودی</div>
<button onclick="add('سیب زمینی سرخ کرده')">افزودن به سبد</button>
</div>
</div>

<section class="cart">
<h2>🛒 سبد خرید</h2>
<div id="cart">هنوز غذایی انتخاب نکرده‌اید.</div>
<button onclick="checkout()">ثبت سفارش</button>
</section>
</main>

<footer>
چارچیز | سفارش آنلاین غذا
</footer>

<script>
let foods=[];
function add(name){
foods.push(name);
showCart();
}
function showCart(){
let cart=document.getElementById('cart');
cart.innerHTML='';
foods.forEach((food,index)=>{
let p=document.createElement('p');
p.textContent=(index+1)+'. '+food;
cart.appendChild(p);
});
if(foods.length===0) cart.textContent='سبد خرید خالی است.';
}
function checkout(){
if(foods.length===0){
alert('ابتدا یک غذا انتخاب کنید.');
return;
}
alert('سفارش شما:\n'+foods.join('\n')+'\n\nاین نسخه آزمایشی است؛ اتصال ثبت سفارش را در مرحله بعد انجام می‌دهیم.');
}
</script>
</body>
</html>
