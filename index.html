
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چارچیز | سفارش آنلاین</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:tahoma,Arial}
header{background:#171717;color:white;text-align:center;padding:30px 15px}
header h1{color:#ef2929;font-size:32px;margin:0}
header p{color:#ddd}
main{max-width:750px;margin:25px auto;padding:15px}
h2{margin-bottom:20px}
.item,.cart{background:white;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #ddd}
.emoji{text-align:center;font-size:65px}
.price{color:#e32626;font-size:20px;font-weight:bold}
button{border:0;border-radius:10px;background:#df2626;color:white;padding:14px 20px;font-size:16px;cursor:pointer}
button:active{opacity:.7}
.item button{width:100%}
input,textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:9px;font:inherit}
.total{font-size:20px;font-weight:bold;color:#d22}
footer{text-align:center;background:#171717;color:white;padding:20px}
</style>
</head>
<body>

<header>
<h1>🍕 چارچیز</h1>
<p>طعم خوشمزه، سفارش آسان!</p>
</header>

<main>
<h2>🍽️ منوی غذا</h2>

<div class="item">
<div class="emoji">🍗</div>
<h3>مغز فیله سوخاری</h3>
<p>۵۰۰ گرم</p>
<p class="price">۶۵۰٬۰۰۰ تومان</p>
<button onclick="addFood()">افزودن به سبد خرید</button>
</div>

<div class="cart">
<h2>🛒 سبد خرید</h2>
<div id="cart">سبد خرید خالی است.</div>
<p class="total" id="total">مبلغ کل: ۰ تومان</p>
<button onclick="checkout()">ثبت سفارش</button>
</div>

<div class="cart">
<h2>📍 اطلاعات مشتری</h2>
<input id="name" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس" inputmode="tel">
<textarea id="address" placeholder="آدرس کامل محل تحویل"></textarea>
</div>
</main>

<footer>
چارچیز | سفارش آنلاین غذا
</footer>

<script>
let count=0;
const price=650000;

function addFood(){
count++;
showCart();
}

function removeFood(){
count=Math.max(0,count-1);
showCart();
}

function showCart(){
let cart=document.getElementById("cart");
if(count===0){
cart.innerHTML="سبد خرید خالی است.";
}else{
cart.innerHTML=
"مغز فیله سوخاری ۵۰۰ گرم × "+count+
"<br><br><button onclick='removeFood()'>حذف یک عدد</button>";
}
document.getElementById("total").innerText=
"مبلغ کل: "+(count*price).toLocaleString("fa-IR")+" تومان";
}

function checkout(){
let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();

if(count===0){alert("سبد خرید خالی است");return;}
if(!name||!phone||!address){
alert("لطفاً اطلاعات مشتری را کامل کنید");
return;
}

alert(
"سفارش شما آماده ثبت است.\n"+
"نام: "+name+"\n"+
"تلفن: "+phone+"\n"+
"آدرس: "+address+"\n"+
"مغز فیله سوخاری: "+count+" عدد\n"+
"مبلغ: "+(count*price).toLocaleString("fa-IR")+" تومان"
);
}
</script>
</body>
</html>
